schema_version: "1.0"
workflow:
  id: "pipeline-full"
  name: "Pipeline Full Lane"
  version: "1.0.0"
  author: "ai-dev-pipeline"
  description: "Full lane — clarify, checklist, analyze, implement, converge, security gate"

requires:
  speckit_version: ">=0.8.5"
  integrations:
    any: ["cursor", "claude", "copilot", "gemini", "opencode"]

inputs:
  spec:
    type: string
    required: true
  integration:
    type: string
    default: "auto"
  spec_verdict:
    type: string
    enum: ["", approve, reject]
    default: ""
  clarify_verdict:
    type: string
    enum: ["", approve, reject]
    default: ""
  plan_verdict:
    type: string
    enum: ["", approve, reject]
    default: ""
  tasks_verdict:
    type: string
    enum: ["", approve, reject]
    default: ""
  security_verdict:
    type: string
    enum: ["", approve, reject, skip]
    default: ""
  final_verdict:
    type: string
    enum: ["", approve, reject]
    default: ""

steps:
  - id: specify
    command: speckit.specify
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: review-spec
    type: gate
    message: "Review initial spec before clarify."
    options: [approve, reject]
    on_reject: abort
    verdict_input: spec_verdict

  - id: clarify
    command: speckit.clarify
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: review-clarify
    type: gate
    message: "Approve clarified spec."
    options: [approve, reject]
    on_reject: abort
    verdict_input: clarify_verdict

  - id: plan
    command: speckit.plan
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: checklist
    command: speckit.checklist
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: review-plan
    type: gate
    message: "Review plan + checklist before tasks."
    options: [approve, reject]
    on_reject: abort
    verdict_input: plan_verdict

  - id: tasks
    command: speckit.tasks
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: analyze
    command: speckit.analyze
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: review-tasks
    type: gate
    message: "Review tasks/analyze before implement."
    options: [approve, reject]
    on_reject: abort
    verdict_input: tasks_verdict

  - id: implement
    command: speckit.implement
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: converge
    command: speckit.converge
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: review-security
    type: gate
    message: "Security review (approve, reject, or skip if N/A)."
    options: [approve, reject, skip]
    on_reject: abort
    verdict_input: security_verdict

  - id: review-final
    type: gate
    message: "Final human approval for full lane."
    options: [approve, reject]
    on_reject: abort
    verdict_input: final_verdict
